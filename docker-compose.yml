services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: intelligent-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - intelligent-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intelligent-backend
    command: ["node", "server.js"]
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - backend_node_modules:/app/backend/node_modules
    ports:
      - "8081:8081"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_access}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      PORT: ${PORT:-8081}
      DEBUG: ${DEBUG:-True}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - intelligent-network

  db:
    image: postgres:16-alpine
    container_name: intelligent-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_access}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - intelligent-network

networks:
  intelligent-network:
    name: ficct-primer-parcial-inf552_intelligent-network

volumes:
  postgres_data:
  backend_node_modules:
